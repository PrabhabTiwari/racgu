<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="themeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="40%" stop-color="#BE185D" />
      <stop offset="75%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <linearGradient id="arrowGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
  </defs>

  <!-- LEFT EMBLEM GRAPHIC -->
  <g transform="translate(10, 10)">
    <!-- Outer sweeping crescent / dynamic swirl -->
    <path d="M 230,20 C 130,20 40,90 25,200 C 10,310 90,410 200,430 C 290,445 370,390 395,310 C 375,340 330,370 270,365 C 190,360 120,310 110,230 C 100,150 160,80 240,65 C 290,55 335,75 365,105 C 340,55 290,20 230,20 Z" fill="url(#themeGradient)" />

    <!-- Golden Knowledge / Idea Rays -->
    <line x1="165" y1="110" x2="150" y2="85" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <line x1="195" y1="95" x2="195" y2="65" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <line x1="225" y1="100" x2="240" y2="75" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <line x1="250" y1="115" x2="275" y2="95" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />

    <!-- Silhouette Profile of Human Head (Facing Right) -->
    <path d="M 120,230 C 120,165 160,115 225,115 C 275,115 305,145 315,185 C 318,195 328,205 335,210 C 345,218 335,235 328,240 C 322,245 325,255 325,265 C 322,275 310,285 295,285 C 275,320 230,345 170,345 C 145,345 130,320 135,290 C 125,270 120,250 120,230 Z" fill="#D91B5C" />

    <!-- Lightbulb Base & Glass inside Head -->
    <!-- Bulb Glass Fill -->
    <path d="M 175,230 C 160,215 155,190 165,170 C 175,150 200,140 220,145 C 240,150 255,170 250,195 C 248,205 240,215 235,225 L 235,245 L 180,245 Z" fill="#FFFFFF" stroke="#BE185D" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Bulb Base Screw Threads -->
    <rect x="183" y="248" width="49" height="6" rx="3" fill="#FFFFFF" stroke="#BE185D" stroke-width="3" />
    <rect x="186" y="257" width="43" height="6" rx="3" fill="#FFFFFF" stroke="#BE185D" stroke-width="3" />
    <path d="M 195,266 L 220,266 C 220,274 195,274 195,266 Z" fill="#BE185D" />

    <!-- Star / Compass Rose inside bulb -->
    <g transform="translate(208, 195) scale(1.1)">
      <!-- 8-point star -->
      <polygon points="0,-26 6,-8 24,-6 8,6 18,24 0,10 -18,24 -8,6 -24,-6 -6,-8" fill="#D91B5C" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Bottom People & City Skyline & Upward Arrow (Impact) -->
    <!-- Sweeping Support Base / Hand -->
    <path d="M 120,310 C 150,330 200,360 280,350 C 330,345 380,310 400,280 C 380,360 280,410 180,390 C 140,380 110,350 120,310 Z" fill="#3B0764" />

    <!-- Celebrating People Figures with raised arms -->
    <g fill="#FFFFFF">
      <!-- Person 1 (Center-Left) -->
      <circle cx="260" cy="300" r="7" />
      <path d="M 245,315 C 255,305 265,305 275,315 L 270,335 L 250,335 Z" />
      <!-- Person 2 (Center-Right, higher) -->
      <circle cx="295" cy="275" r="9" />
      <path d="M 275,290 C 290,280 305,280 318,290 L 310,320 L 285,320 Z" />
      <!-- Person 3 (Right) -->
      <circle cx="330" cy="295" r="7" />
      <path d="M 318,310 C 328,300 338,300 348,310 L 342,330 L 322,330 Z" />
    </g>

    <!-- Cityscape Silhouette on Right -->
    <g fill="#3B0764">
      <rect x="345" y="300" width="10" height="25" />
      <rect x="358" y="285" width="12" height="40" />
      <polygon points="364,275 358,285 370,285" />
      <rect x="373" y="295" width="9" height="30" />
      <rect x="385" y="305" width="12" height="20" />
    </g>

    <!-- Upward-Right Forward Impact Arrow -->
    <g fill="url(#arrowGradient)">
      <path d="M 360,330 L 405,270 L 390,265 L 435,230 L 430,285 L 415,280 L 380,335 Z" />
    </g>
  </g>

  <!-- RIGHT TEXT LOCKUP -->
  <g transform="translate(410, 110)">
    <!-- INSIGHT -->
    <text x="0" y="80" font-family="'Arial Black', Impact, sans-serif" font-size="76" font-weight="900" fill="#D91B5C" letter-spacing="2px">
      INSIGHT
    </text>

    <!-- DIVIDER WITH 'TO' -->
    <line x1="0" y1="122" x2="95" y2="122" stroke="#3B0764" stroke-width="4" stroke-linecap="round" />
    <text x="110" y="130" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#3B0764" letter-spacing="4px">
      TO
    </text>
    <line x1="170" y1="122" x2="275" y2="122" stroke="#3B0764" stroke-width="4" stroke-linecap="round" />

    <!-- IMPACT -->
    <text x="0" y="220" font-family="'Arial Black', Impact, sans-serif" font-size="76" font-weight="900" fill="#3B0764" letter-spacing="2px">
      IMPACT
    </text>
  </g>
</svg>
